# Shared native development broker for gateway + OMS + Risk + alpha/beta.
# Source market-data-gateway/.env, account-service/.env before starting it.
# Additional strategy identities require explicit matching ACL and OMS strategies entries.
listen: $MD_NATS_LISTEN
jetstream { store_dir: "./data/nats" }
authorization {
  users: [
    { user: "portfolio", password: $PORTFOLIO_NATS_PASSWORD, permissions: {
      publish: ["paper.v1.rpc.oms-portfolio.default", "paper.v1.rpc.exec.default.account", "_INBOX.paper.portfolio.>", "_INBOX.paper.alpha.>", "_INBOX.paper.beta.>", "_INBOX.paper.risk.>"]
      subscribe: ["paper.v1.rpc.portfolio.default.account", "paper.v1.rpc.portfolio.default.strategy.*", "_INBOX.paper.portfolio.>"]
    }},
    { user: "oms", password: $OMS_NATS_PASSWORD,
      permissions: {
        publish: ["paper.v1.cmd.risk.default.check", "paper.v1.cmd.exec.default.order", "paper.v1.evt.oms.default.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.OMS_paper_default.>"]
        subscribe: ["paper.v1.rpc.oms.default.*", "paper.v1.rpc.oms-risk.default", "paper.v1.rpc.oms-exec.default", "paper.v1.rpc.oms-portfolio.default", "_INBOX.paper.oms.>"]
      }
    },
    { user: "risk", password: $RISK_NATS_PASSWORD,
      permissions: {
        publish: ["paper.v1.rpc.portfolio.default.account", "paper.v1.rpc.oms-risk.default", "paper.v1.evt.risk.default.decision", "paper.v1.rpc.risk.default.health", "_INBOX.paper.risk.>", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_default.risk_checks", "$JS.ACK.OMS_paper_default.risk_checks.>"]
        subscribe: ["paper.v1.rpc.risk.default.health", "_INBOX.paper.risk.>"]
      }
    },
    { user: "gateway", password: $MD_NATS_PASSWORD,
      permissions: {
        publish: ["paper.v1.md.>", "_INBOX.>", "$JS.API.>"]
        subscribe: ["paper.v1.rpc.md.>", "paper.v1.query.md.>", "_INBOX.>"]
      }
    },
    { user: "alpha", password: $MD_ALPHA_PASSWORD,
      permissions: {
        publish: ["paper.v1.rpc.portfolio.default.strategy.alpha", "paper.v1.rpc.md.alpha.subscription.*", "paper.v1.query.md.alpha.*", "paper.v1.cmd.oms.default.alpha", "paper.v1.rpc.oms.default.alpha", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_default.strategy_paper_default_alpha", "$JS.ACK.OMS_paper_default.strategy_paper_default_alpha.>"]
        subscribe: ["paper.v1.md.>", "_INBOX.paper.alpha.>"]
      }
    },
    { user: "beta", password: $MD_BETA_PASSWORD,
      permissions: {
        publish: ["paper.v1.rpc.portfolio.default.strategy.beta", "paper.v1.rpc.md.beta.subscription.*", "paper.v1.query.md.beta.*", "paper.v1.cmd.oms.default.beta", "paper.v1.rpc.oms.default.beta", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_default.strategy_paper_default_beta", "$JS.ACK.OMS_paper_default.strategy_paper_default_beta.>"]
        subscribe: ["paper.v1.md.>", "_INBOX.paper.beta.>"]
      }
    }
  ]
}
