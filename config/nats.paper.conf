# Dedicated IB_PAPER broker; start from account-service/ after sourcing its private .env.
listen: $EXECUTION_NATS_LISTEN
jetstream { store_dir: "./data/nats-paper" }
authorization { users: [
  { user: "oms", password: $OMS_NATS_PASSWORD, permissions: {
    publish: ["paper.v1.cmd.risk.paperib.check", "paper.v1.cmd.exec.paperib.order", "paper.v1.evt.oms.paperib.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.OMS_paper_paperib.>"]
    subscribe: ["paper.v1.rpc.oms.paperib.*", "paper.v1.rpc.oms-risk.paperib", "paper.v1.rpc.oms-exec.paperib", "paper.v1.rpc.oms-portfolio.paperib", "_INBOX.paper.oms.>"]
  }},
  { user: "risk", password: $RISK_NATS_PASSWORD, permissions: {
    publish: ["paper.v1.rpc.portfolio.paperib.account", "paper.v1.rpc.oms-risk.paperib", "paper.v1.evt.risk.paperib.decision", "_INBOX.paper.risk.>", "_INBOX.paper.operator.>", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_paperib.risk_checks", "$JS.ACK.OMS_paper_paperib.risk_checks.>"]
    subscribe: ["paper.v1.rpc.risk.paperib.health", "_INBOX.paper.risk.>"]
  }},
  { user: "execution", password: $EXECUTION_NATS_PASSWORD, permissions: {
    publish: ["paper.v1.rpc.oms-exec.paperib", "paper.v1.evt.exec.paperib.broker", "_INBOX.paper.execution.>", "_INBOX.paper.portfolio.>", "_INBOX.paper.operator.>", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_paperib.execution_commands", "$JS.ACK.OMS_paper_paperib.execution_commands.>"]
    subscribe: ["paper.v1.rpc.exec.paperib.account", "paper.v1.rpc.exec.paperib.health", "_INBOX.paper.execution.>"]
  }},
  { user: "alpha", password: $PAPER_ALPHA_PASSWORD, permissions: {
    publish: ["paper.v1.rpc.portfolio.paperib.strategy.alpha", "paper.v1.cmd.oms.paperib.alpha", "paper.v1.rpc.oms.paperib.alpha", "$JS.API.CONSUMER.MSG.NEXT.OMS_paper_paperib.strategy_paper_paperib_alpha", "$JS.ACK.OMS_paper_paperib.strategy_paper_paperib_alpha.>"]
    subscribe: ["_INBOX.paper.alpha.>"]
  }},
  { user: "portfolio", password: $PORTFOLIO_NATS_PASSWORD, permissions: {
    publish: ["paper.v1.rpc.oms-portfolio.paperib", "paper.v1.rpc.exec.paperib.account", "_INBOX.paper.portfolio.>", "_INBOX.paper.alpha.>", "_INBOX.paper.risk.>", "_INBOX.paper.operator.>"]
    subscribe: ["paper.v1.rpc.portfolio.paperib.account", "paper.v1.rpc.portfolio.paperib.strategy.*", "_INBOX.paper.portfolio.>"]
  }},
  { user: "operator", password: $PAPER_OPERATOR_PASSWORD, permissions: {
    publish: ["paper.v1.rpc.portfolio.paperib.account", "paper.v1.rpc.risk.paperib.health", "paper.v1.rpc.exec.paperib.health", "_INBOX.paper.operator.>"]
    subscribe: ["_INBOX.paper.operator.>"]
  }}
]}
